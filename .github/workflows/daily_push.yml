# GitHub 只负责定时唤醒和触发，股票计算与 SMTP 发信均在 Streamlit Web 完成。
# 早班：北京 03:30 预热 / 04:00 起每 20 分钟触发（UTC 前一日 19:30 / 20:00）。
#   GitHub 免费仓库 schedule 常年延迟约 4~5 小时（实测近5天早班实际触发在北京 11:51~13:35），
#   v1.57 起把计划触发提前 4 小时，让实际到信落在 08:00~09:00。
# 晚班：北京 19:30 预热 / 20:00 起每 20 分钟冗余触发并分时段判重（未改动）。
name: 每日选股推送

on:
  schedule:
    # 早班预热：北京周一至周五 03:30 = UTC 周日至周四 19:30
    - cron: '30 19 * * 0-4'
    # 早班推送：北京周一至周五 04:00 / 04:20 / 04:40 = UTC 周日至周四 20:00 / 20:20 / 20:40
    - cron: '0,20,40 20 * * 0-4'
    # 北京周一至周五 19:30
    - cron: '30 11 * * 1-5'
    # 北京周一至周五 20:00 / 20:20 / 20:40
    - cron: '0,20,40 12 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: '执行预热或邮件推送'
        required: true
        default: 'push'
        type: choice
        options:
          - push
          - warmup
      slot:
        description: '早班或晚班'
        required: true
        default: 'am'
        type: choice
        options:
          - am
          - pm
      force:
        description: '忽略当前时段已发送标记（仅用于明确补发）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装真实浏览器触发依赖
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: 唤醒 Web 并等待执行结果
        id: trigger
        env:
          PUSH_TRIGGER_TOKEN: ${{ secrets.PUSH_TRIGGER_TOKEN }}
          PUSH_WEB_URL: ${{ vars.PUSH_WEB_URL || 'https://stock-picker-mi5bntxj6x4fzrntgtzvko.streamlit.app/' }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          TRIGGER_ACTION: ${{ inputs.action }}
          TRIGGER_SLOT: ${{ inputs.slot }}
          PUSH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: python web_trigger.py

      - name: 拉取 Web 留档并立即保存推送状态
        if: steps.trigger.outputs.result == 'sent'
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@local"
          git pull --rebase --autostash origin master
          git add 推送状态.json
          git diff --cached --quiet || git commit -m "记录 Web 邮件推送状态 $(date +%F)"
          git push

      - name: 安装进化引擎依赖
        if: steps.trigger.outputs.result == 'sent'
        run: python -m pip install -r requirements.txt

      - name: 自动进化引擎（检查实盘记录是否达到升级条件）
        if: steps.trigger.outputs.result == 'sent'
        run: python evolution.py

      - name: 回传进化配置和剩余留档
        if: steps.trigger.outputs.result == 'sent'
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@local"
          git add 推送记录.csv 推送状态.json 因子历史IC.csv strategy_config.json fundamental_cache/ 实盘台账.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "每日留档 + 进化配置 $(date +%F)"
          git pull --rebase --autostash origin master
          git push
