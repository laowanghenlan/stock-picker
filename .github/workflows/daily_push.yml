# 周一至周五北京时间 9:00 自动选股并发送QQ邮件
# GitHub 使用 UTC 时间，北京 9:00 = UTC 当天 1:00
#
# 【可靠性设计】GitHub 自带 cron 是"尽力而为"，高负载时会延迟数十分钟甚至直接跳过（2026-11-11 就漏发过一次）。
#   第一层：同一 cron 配 3 个时间点（9:00 / 9:40 / 10:20）冗余触发；脚本内做"当天已发则跳过"判断，不会重复发信
#   第二层：外部 cron-job.org 每天 9:05 调 workflow_dispatch API 兜底（手动触发 = 强制发送，不看当天是否已发）
name: 每日选股推送

on:
  schedule:
    - cron: '0 1 * * 1-5'      # 北京 09:00（主）
    - cron: '40 1 * * 1-5'     # 北京 09:40（主时间点被跳过时补发）
    - cron: '20 2 * * 1-5'     # 北京 10:20（再兜一层）
  workflow_dispatch:              # 手动 / cron-job.org 外部兜底触发（强制发送）

permissions:
  contents: write                 # 允许工作流把推送记录回传仓库（新仓库默认只读，必须显式声明）

# 同组任务串行：避免 9:00 那次被延迟后与 9:40 那次并发重复发信
concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行选股并发送邮件
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}            # 在仓库 Settings→Secrets 里配置
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}    # QQ邮箱SMTP授权码
          CAPITAL: '2200'
          # 手动/外部触发时强制发送（用于测试和 cron-job.org 兜底），定时触发则当天已发就跳过
          PUSH_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python daily_push.py

      - name: 🔬 自动进化引擎（检查实盘记录够不够触发30/60/100笔升级）
        run: python evolution.py

      - name: 推送记录 + 策略配置 回传仓库
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@local"
          # 推送状态.json 是"今天已发过"的标记，必须回传，否则冗余 cron 会重复发信
          git add 推送记录.csv 推送状态.json 因子历史IC.csv strategy_config.json fundamental_cache/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "每日留档 + 进化配置 $(date +%F)"
          git pull --rebase --autostash origin master || true
          git push
