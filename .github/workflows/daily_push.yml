# 周一至周五北京时间 9:00 自动选股并发送QQ邮件
# GitHub 使用 UTC 时间，北京 9:00 = UTC 当天 1:00，因此 cron 为周一~周五 1:00
name: 每日选股推送

on:
  schedule:
    - cron: '0 1 * * 1-5'      # UTC 周一~周五 1:00 = 北京 周一~周五 9:00
  workflow_dispatch:              # 允许在 Actions 页面手动点 Run 测试

permissions:
  contents: write                 # 允许工作流把推送记录回传仓库（新仓库默认只读，必须显式声明）

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行选股并发送邮件
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}            # 在仓库 Settings→Secrets 里配置
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}    # QQ邮箱SMTP授权码
          CAPITAL: '2200'
        run: python daily_push.py

      - name: 🔬 自动进化引擎（检查实盘记录够不够触发30/60/100笔升级）
        run: python evolution.py

      - name: 推送记录 + 策略配置 回传仓库
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@local"
          git add 推送记录.csv 因子历史IC.csv strategy_config.json
          git diff --cached --quiet || git commit -m "每日留档 + 进化配置 $(date +%F)"
          git push
